<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Deck Builder</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Deck Builder</h1>
        <button id="addCurrentCardBtn" type="button">Add Current Card</button>
      </header>

      <section class="deck-controls">
        <label for="deckSelect">Active deck</label>
        <select id="deckSelect"></select>
        <div class="deck-actions">
          <button id="newDeckBtn" type="button">New Deck</button>
          <button id="deleteDeckBtn" type="button">Delete Deck</button>
        </div>
      </section>

      <section class="stats" id="stats"></section>

      <section>
        <ul id="cardList" class="card-list"></ul>
      </section>

      <footer class="actions">
        <button id="exportBtn" type="button">Copy Decklist</button>
        <p id="status" role="status" aria-live="polite"></p>
      </footer>
    </main>
    <dialog id="createDeckDialog">
      <form id="createDeckForm" method="dialog" class="deck-form">
        <h2>Create Deck</h2>
        <label for="deckNameInput">Deck name</label>
        <input id="deckNameInput" name="deckName" type="text" required maxlength="80" />
        <label for="deckFormatSelect">Format</label>
        <select id="deckFormatSelect" name="deckFormat"></select>
        <div class="deck-form-actions">
          <button type="button" id="cancelCreateDeckBtn">Cancel</button>
          <button type="submit">Create</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
